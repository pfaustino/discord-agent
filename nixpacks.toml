# Node.js runtime. The whole bot is nodebot/ — text chat, voice (DAVE E2EE
# via @snazzah/davey), moderation, automod, welcome, and the AI tool loop.
# The Python tree is dormant: still in the repo, never installed or started.
#
# nodejs_22 — required by nodebot (node:sqlite, used by src/db.js, is built
#             into Node 22, so there is no native sqlite to compile)
# ffmpeg    — TTS playback via prism-media
#
# Overriding [phases.install] replaces Nixpacks' auto-detected pip install
# (root requirements.txt still makes it detect a Python app), so no Python
# dependencies are installed.
[phases.setup]
nixPkgs = ["nodejs_22"]
aptPkgs = ["ffmpeg"]

[phases.install]
cmds = ["cd nodebot && npm ci --omit=dev"]

# Register slash commands, then hand the process over to the bot. The `||`
# keeps registration non-fatal: a Discord API hiccup or a missing CLIENT_ID
# must not stop Max from coming up. `exec` replaces the shell so the bot is
# PID 1 and receives Railway's shutdown signals directly.
[start]
cmd = "node nodebot/src/deploy-commands.js || echo 'slash-command registration skipped — bot still starting'; exec node nodebot/src/index.js"
